name: CI
on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  citas:
    name: citas-${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: citas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d citas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ms-citas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ms-citas/requirements.lock
      - run: pip install -r requirements.lock
      - run: ruff check app tests
      - name: Check exported OpenAPI
        run: python -c "import json; from pathlib import Path; from app.main import create_app; assert json.loads(Path('openapi.json').read_text()) == create_app().openapi()"
      - name: Tests SQLite
        if: matrix.database == 'sqlite'
        run: pytest -q --junitxml=results.xml
      - name: Tests PostgreSQL
        if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/citas_test
        run: pytest -q --junitxml=results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-citas-${{ matrix.database }}
          path: ms-citas/results.xml
  integration-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate full release contract on main
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: bash deploy/check-release.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Agenda tests when contributed
        shell: bash
        run: |
          if [ -f ms-agenda/package.json ]; then
            cd ms-agenda
            npm ci
            npm test -- --run
            npm run build
            test -f dist/server.js
          else
            echo 'Agenda pendiente de integración; release a main bloqueado por check-release.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Harness tests when contributed
        shell: bash
        run: |
          if [ -f harness/requirements.lock ]; then
            cd harness
            pip install -r requirements.lock
            MOCK_LLM=true python -m pytest -q
          else
            echo 'Harness pendiente de integración; release a main bloqueado por check-release.' >> "$GITHUB_STEP_SUMMARY"
          fi
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ms-citas:test ms-citas
      - name: Check scripts and Compose
        env:
          POSTGRES_PASSWORD: ci_test_only
        run: |
          bash -n deploy/deploy.sh deploy/check-release.sh
          docker compose config --quiet
